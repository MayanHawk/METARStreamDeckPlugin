<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>METAR Settings</title>

    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>

    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 12px;
            color: #d8d8d8;
            background: #2d2d2d;
        }

        .hint {
            margin-top: 8px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

    <sdpi-item label="ICAO Station">
        <sdpi-textfield
            id="icao"
            setting="icao"
            maxlength="4"
            placeholder="KAVP">
        </sdpi-textfield>
    </sdpi-item>

    <div class="hint">
        Enter a 4-character ICAO airport/station code.
    </div>

    <script>
        const icao = document.getElementById("icao");

        icao.addEventListener("input", () => {
            icao.value = icao.value
                .toUpperCase()
                .replace(/[^A-Z0-9]/g, "")
                .substring(0, 4);
        });
    </script>

</body>
</html>
