<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>METAR Settings</title>

    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>

    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 12px;
            color: #d8d8d8;
            background: #2d2d2d;
        }

        .hint {
            margin-top: 4px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

    <sdpi-item label="ICAO Station">
        <sdpi-textfield
            id="icao"
            setting="icao"
            maxlength="4"
            placeholder="KAVP">
        </sdpi-textfield>
    </sdpi-item>

    <div class="hint">
        Enter a 4-character ICAO airport/station code.
    </div>

    <sdpi-item label="Long Press (ms)">
        <sdpi-range
            setting="longPressMs"
            min="500"
            max="3000"
            step="100"
            default="1100"
            showlabels>
            <span slot="min">500</span>
            <span slot="max">3000</span>
        </sdpi-range>
    </sdpi-item>

    <sdpi-item label="Refresh (min)">
        <sdpi-textfield
            id="refreshMinutes"
            setting="refreshMinutes"
            placeholder="5"
            default="5">
        </sdpi-textfield>
    </sdpi-item>

    <div class="hint">
        Auto-refresh interval in minutes (minimum 1).
    </div>

    <script>
        const icao = document.getElementById("icao");

        icao.addEventListener("input", () => {
            icao.value = icao.value
                .toUpperCase()
                .replace(/[^A-Z0-9]/g, "")
                .substring(0, 4);
        });

        const refreshMinutes = document.getElementById("refreshMinutes");

        refreshMinutes.addEventListener("input", () => {
            refreshMinutes.value = refreshMinutes.value.replace(/[^0-9]/g, "");
        });
    </script>

</body>
</html>
